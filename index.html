<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação - Melhores das Séries 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🌙 Botão de alternância de tema -->
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
</button>

<div class="container">
    <h1>
        <svg class="icon-title" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
            <path d="m6.2 5.3 3.1 3.9"/>
            <path d="m12.4 3.4 3.1 4"/>
            <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        Premiação Melhores das Séries 2026
    </h1>
    
    <!-- Ecrã de Login -->
    <div id="login-section">
        <h2>Acesso à Votação</h2>
        <form id="form-login">
            <label for="nome-login">Nome Completo</label>
            <input type="text" id="nome-login" required placeholder="Digite o seu nome completo">

            <label for="email-login">E-mail</label>
            <input type="email" id="email-login" required placeholder="nome.sobrenome@email.com">

            <button type="submit" id="btn-login">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="6 3 20 12 6 21 6 3"/>
                </svg>
                Entrar
            </button>
        </form>
    </div>

    <!-- Ecrã de Votação -->
    <div id="votacao-section">
        <!-- 🆕 Toggle de modo -->
        <div class="modo-toggle" id="modo-toggle">
            <button type="button" class="modo-btn active" data-modo="etapas">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                Passo a passo
            </button>
            <button type="button" class="modo-btn" data-modo="rapido">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                Tudo de uma vez
            </button>
        </div>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="progresso-texto">Passo 1 de 3</span>
                <span style="font-weight: normal;">Eleitor: <strong class="nome-exibicao" style="color: var(--primary-color);"></strong></span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progresso-barra"></div>
            </div>
        </div>

        <form id="form-votacao">
            <div id="secoes-votacao"></div>
            <div class="navegacao-botoes">
                <button type="button" id="btn-anterior" class="btn-secundario" style="display: none;">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Voltar
                </button>
                <button type="button" id="btn-proximo">
                    Avançar para a Próxima Categoria
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
                <button type="button" id="btn-revisar" style="display: none;">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Revisar Meus Votos
                </button>
            </div>
        </form>
    </div>

    <!-- Ecrã de Resumo / Recibo -->
    <div id="resumo-section" style="display: none;">
        <div class="cargo-header" id="header-resumo">
            <h2>Resumo das Suas Escolhas</h2>
            <p>Por favor, confira os seus indicados antes de confirmar.</p>
        </div>
        
        <div id="lista-resumo"></div>

        <div id="botoes-resumo" class="navegacao-botoes">
            <button type="button" id="btn-voltar-edicao" class="btn-secundario">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Alterar Votos
            </button>
            <button type="button" id="btn-confirmar-final">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
                Confirmar e Enviar
            </button>
        </div>

        <div id="mensagem-sucesso" style="display: none; text-align: center; padding: 20px; border-radius: 8px; margin-top: 20px;">
            <h3>Votos Registados com Sucesso!</h3>
            <p>Agradecemos a sua participação. As suas escolhas já estão seguras no nosso sistema.</p>
        </div>

        <!-- 🆕 Ações de comprovante -->
        <div class="comprovante-acoes no-capture" id="comprovante-acoes" style="display: none;">
            <button type="button" class="btn-secundario" id="btn-baixar-comprovante">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Baixar comprovante
            </button>
            <button type="button" id="btn-compartilhar-comprovante">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                Compartilhar comprovante
            </button>
        </div>
    </div>
</div>

<!-- Modal customizado (aviso / confirmação) -->
<div id="modal-custom" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <div class="modal-icon-wrapper" id="modal-icon-wrapper">
            <svg id="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></svg>
        </div>
        <h3 id="modal-titulo">Atenção</h3>
        <p id="modal-mensagem">Mensagem</p>
        <div class="modal-botoes" id="modal-botoes"></div>
    </div>
</div>

<!-- 🆕 Modal de Preview do Candidato -->
<div id="modal-preview" class="modal-overlay" style="display: none;">
    <div class="preview-box">
        <button type="button" class="preview-fechar" id="preview-fechar" aria-label="Fechar preview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <div class="preview-foto-wrap">
            <img id="preview-foto" src="" alt="">
            <span class="preview-badge-pos" id="preview-badge-pos"></span>
        </div>
        <h3 id="preview-nome"></h3>
        <p class="preview-serie" id="preview-serie"></p>
        <p class="preview-categoria" id="preview-categoria"></p>
        <div class="preview-acoes">
            <button type="button" class="btn-secundario" id="preview-cancelar">Fechar</button>
            <button type="button" id="preview-escolher">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span id="preview-escolher-texto">Escolher este</span>
            </button>
        </div>
    </div>
</div>

<!-- 🆕 Bibliotecas externas -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
